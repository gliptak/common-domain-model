name: CDM Build and Deploy

on:
  push:
    branches:
      - master
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  MAVEN_OPTS: "-Xmx5g -XX:+UseG1GC"

jobs:
  setup:
    name: Setup Build Environment
    runs-on: ubuntu-latest
    outputs:
      release-name: ${{ steps.set-version.outputs.release-name }}
      maven-build-profiles: ${{ steps.set-version.outputs.maven-build-profiles }}
      is-release: ${{ steps.set-version.outputs.is-release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Type and Version
        id: set-version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "is-release=true" >> $GITHUB_OUTPUT
            RELEASE_NAME="${{ github.ref_name }}"
            MAVEN_BUILD_PROFILES="daml,scala,typescript,golang,csharp8,csharp9,kotlin,full,release,excel,json-schema"
          else
            echo "is-release=false" >> $GITHUB_OUTPUT
            # Extract branch name
            BRANCH_NAME="${{ github.ref_name }}"
            # Normalize branch name (replace / with -)
            BRANCH_NORMALIZED=$(echo "$BRANCH_NAME" | sed 's/\//-/g')
            RELEASE_NAME="0.0.0.${BRANCH_NORMALIZED}-SNAPSHOT"
            MAVEN_BUILD_PROFILES="daml,scala,typescript,golang,csharp8,csharp9,kotlin,release,excel,json-schema"
          fi
          echo "release-name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "maven-build-profiles=$MAVEN_BUILD_PROFILES" >> $GITHUB_OUTPUT
          echo "Release Name: $RELEASE_NAME"
          echo "Maven Build Profiles: $MAVEN_BUILD_PROFILES"
          echo "Is Release: ${{ github.ref_type == 'tag' }}"

  build:
    name: Maven Build
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Import GPG key
        if: needs.setup.outputs.is-release == 'true'
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Set Maven Version
        run: |
          mvn versions:set -DnewVersion=${{ needs.setup.outputs.release-name }} versions:update-child-modules -DallowSnapshots=true

      - name: Maven Build and Deploy
        env:
          CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
          CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
          GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -s settings.xml clean install org.sonatype.central:central-publishing-maven-plugin:0.7.0:publish -P "${{ needs.setup.outputs.maven-build-profiles }}"

      - name: Upload Maven Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts
          path: |
            rosetta-source/target/
            rosetta-source/src/generated/
          retention-days: 7

  # Parallel build jobs for different language targets
  build-daml:
    name: Build DAML
    runs-on: ubuntu-latest
    needs: [setup, build]
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Maven Artifacts
        uses: actions/download-artifact@v4
        with:
          name: maven-artifacts
          path: ./

      - name: Build DAML
        uses: docker://digitalasset/daml-sdk:1.3.0
        with:
          args: bash -c "cd rosetta-source && daml build -o target/cdm-daml-${{ needs.setup.outputs.release-name }}.dar"

      - name: Upload DAML Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daml-artifacts
          path: rosetta-source/target/cdm-daml-*.dar
          retention-days: 7

  build-scala:
    name: Build Scala
    runs-on: ubuntu-latest
    needs: [setup, build]
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Maven Artifacts
        uses: actions/download-artifact@v4
        with:
          name: maven-artifacts
          path: ./

      - name: Build Scala
        uses: docker://mozilla/sbt:8u292_1.5.7
        with:
          args: bash -c "cd rosetta-source/target/classes/cdm/scala && sbt compile && sbt package && sbt doc && sbt packageDoc packageSrc"

      - name: Upload Scala Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scala-artifacts
          path: rosetta-source/target/classes/cdm/scala/target/
          retention-days: 7

  build-csharp8:
    name: Build C# 8
    runs-on: ubuntu-latest
    needs: [setup, build]
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Maven Artifacts
        uses: actions/download-artifact@v4
        with:
          name: maven-artifacts
          path: ./

      - name: Setup .NET Core 3.1
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.1.x'

      - name: Build and Test C# 8
        run: |
          cd rosetta-source/target/classes/cdm/csharp8/NetStandard.2.1
          dotnet build Cdm/Cdm.csproj
          dotnet test Test/Test.csproj
          dotnet publish Cdm/Cdm.csproj -c release -o ./app

      - name: Upload C# 8 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: csharp8-artifacts
          path: rosetta-source/target/classes/cdm/csharp8/NetStandard.2.1/app/
          retention-days: 7

  build-csharp9:
    name: Build C# 9
    runs-on: ubuntu-latest
    needs: [setup, build]
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Maven Artifacts
        uses: actions/download-artifact@v4
        with:
          name: maven-artifacts
          path: ./

      - name: Setup .NET 5.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '5.0.x'

      - name: Build and Test C# 9
        run: |
          cd rosetta-source/target/classes/cdm/csharp9/Net.5.0
          dotnet build Cdm/Cdm.csproj
          dotnet test Test/Test.csproj
          dotnet publish Cdm/Cdm.csproj -c release -o ./app

      - name: Upload C# 9 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: csharp9-artifacts
          path: rosetta-source/target/classes/cdm/csharp9/Net.5.0/app/
          retention-days: 7

  build-python:
    name: Build Python
    runs-on: ubuntu-latest
    needs: [setup, build]
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Maven Artifacts
        uses: actions/download-artifact@v4
        with:
          name: maven-artifacts
          path: ./

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build Python
        run: |
          rosetta-source/src/main/resources/build-resources/python/build-cdm-python.sh

      - name: Upload Python Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-artifacts
          path: rosetta-source/src/generated/python/
          retention-days: 7

  # Deployment jobs
  deploy-daml:
    name: Deploy DAML
    runs-on: ubuntu-latest
    needs: [setup, build, build-daml]
    if: needs.setup.outputs.is-release == 'true'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download DAML Artifacts
        uses: actions/download-artifact@v4
        with:
          name: daml-artifacts
          path: rosetta-source/target/

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Deploy DAML
        env:
          CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
          CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
          GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd rosetta-source/target
          tar -cvzf cdm-daml-${{ needs.setup.outputs.release-name }}.tar.gz cdm-daml-${{ needs.setup.outputs.release-name }}.dar
          ../src/main/resources/build-resources/create-deploy-pom.sh cdm-daml ${{ needs.setup.outputs.release-name }} tar.gz
          mvn deploy -Prelease -Dcheckstyle.skip=true -Dmaven.deploy.skip=true -s ../../settings.xml

  deploy-scala:
    name: Deploy Scala
    runs-on: ubuntu-latest
    needs: [setup, build, build-scala]
    if: needs.setup.outputs.is-release == 'true'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download Scala Artifacts
        uses: actions/download-artifact@v4
        with:
          name: scala-artifacts
          path: rosetta-source/target/classes/cdm/scala/target/

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Deploy Scala
        env:
          CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
          CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
          GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd rosetta-source/target/classes/cdm/scala/target/scala-2.12
          mv cdm-scala_2.12-0.0.0.snapshot.jar cdm-scala-${{ needs.setup.outputs.release-name }}.jar
          mv cdm-scala_2.12-0.0.0.snapshot-sources.jar cdm-scala-${{ needs.setup.outputs.release-name }}-sources.jar
          mv cdm-scala_2.12-0.0.0.snapshot-javadoc.jar cdm-scala-${{ needs.setup.outputs.release-name }}-javadoc.jar
          ../../../../../src/main/resources/build-resources/create-deploy-pom.sh cdm-scala ${{ needs.setup.outputs.release-name }} jar
          mvn deploy -Prelease -Dcheckstyle.skip=true -Dmaven.deploy.skip=true -s ../../../../../../settings.xml

  deploy-csharp8:
    name: Deploy C# 8
    runs-on: ubuntu-latest
    needs: [setup, build, build-csharp8]
    if: needs.setup.outputs.is-release == 'true'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download C# 8 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: csharp8-artifacts
          path: rosetta-source/target/classes/cdm/csharp8/NetStandard.2.1/app/

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Deploy C# 8
        env:
          CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
          CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
          GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd rosetta-source/target/classes/cdm/csharp8/NetStandard.2.1
          tar -cvzf cdm-csharp8-${{ needs.setup.outputs.release-name }}.tar.gz app
          ../../../../src/main/resources/build-resources/create-deploy-pom.sh cdm-csharp8 ${{ needs.setup.outputs.release-name }} tar.gz
          mvn deploy -Prelease -Dcheckstyle.skip=true -Dmaven.deploy.skip=true -s ../../../../../settings.xml

  deploy-csharp9:
    name: Deploy C# 9
    runs-on: ubuntu-latest
    needs: [setup, build, build-csharp9]
    if: needs.setup.outputs.is-release == 'true'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download C# 9 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: csharp9-artifacts
          path: rosetta-source/target/classes/cdm/csharp9/Net.5.0/app/

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Deploy C# 9
        env:
          CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
          CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
          GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd rosetta-source/target/classes/cdm/csharp9/Net.5.0
          tar -cvzf cdm-csharp9-${{ needs.setup.outputs.release-name }}.tar.gz app
          ../../../../src/main/resources/build-resources/create-deploy-pom.sh cdm-csharp9 ${{ needs.setup.outputs.release-name }} tar.gz
          mvn deploy -Prelease -Dcheckstyle.skip=true -Dmaven.deploy.skip=true -s ../../../../../settings.xml

  deploy-typescript:
    name: Deploy TypeScript
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: needs.setup.outputs.is-release == 'true'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download Maven Artifacts
        uses: actions/download-artifact@v4
        with:
          name: maven-artifacts
          path: ./

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Deploy TypeScript
        env:
          CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
          CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
          GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd rosetta-source/target/classes/cdm
          tar -cvzf cdm-typescript-${{ needs.setup.outputs.release-name }}.zip typescript
          ../../../src/main/resources/build-resources/create-deploy-pom.sh cdm-typescript ${{ needs.setup.outputs.release-name }} zip
          mvn deploy -Prelease -Dcheckstyle.skip=true -Dmaven.deploy.skip=true -s ../../../../settings.xml

  deploy-go:
    name: Deploy Go
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: needs.setup.outputs.is-release == 'true'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download Maven Artifacts
        uses: actions/download-artifact@v4
        with:
          name: maven-artifacts
          path: ./

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Deploy Go
        env:
          CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
          CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
          GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd rosetta-source/target/classes/cdm
          tar -cvzf cdm-golang-${{ needs.setup.outputs.release-name }}.tar.gz golang
          ../../../src/main/resources/build-resources/create-deploy-pom.sh cdm-golang ${{ needs.setup.outputs.release-name }} tar.gz
          mvn deploy -Prelease -Dcheckstyle.skip=true -Dmaven.deploy.skip=true -s ../../../../settings.xml

  deploy-kotlin:
    name: Deploy Kotlin
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: needs.setup.outputs.is-release == 'true'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download Maven Artifacts
        uses: actions/download-artifact@v4
        with:
          name: maven-artifacts
          path: ./

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Deploy Kotlin
        env:
          CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
          CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
          GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd rosetta-source/target/classes/cdm/kotlin
          mvn -f kotlin-build-pom.xml versions:set -DnewVersion=${{ needs.setup.outputs.release-name }} -DallowSnapshots=true
          mvn -f kotlin-build-pom.xml -s ../../../../settings.xml clean install org.sonatype.central:central-publishing-maven-plugin:0.7.0:publish -P release

  deploy-python:
    name: Deploy Python
    runs-on: ubuntu-latest
    needs: [setup, build, build-python]
    if: needs.setup.outputs.is-release == 'true'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download Python Artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-artifacts
          path: rosetta-source/src/generated/python/

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Deploy Python
        env:
          CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
          CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
          GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd rosetta-source/src/generated/python
          tar -cvzf cdm-python-${{ needs.setup.outputs.release-name }}.tar.gz python_cdm-*-py3-none-any.whl rune_runtime-*-py3-none-any.whl
          python3 ../../main/resources/build-resources/python/create-deploy-pom.py cdm-python ${{ needs.setup.outputs.release-name }} tar.gz ../../main/resources/build-resources/python/python-developer.txt
          mvn deploy -Prelease -Dcheckstyle.skip=true -Dmaven.deploy.skip=true -s ../../../../settings.xml

  deploy-excel:
    name: Deploy Excel
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: needs.setup.outputs.is-release == 'true'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download Maven Artifacts
        uses: actions/download-artifact@v4
        with:
          name: maven-artifacts
          path: ./

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Deploy Excel
        env:
          CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
          CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
          GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd rosetta-source/src/generated/excel
          mv model.xlsx encoded.model.xlsx
          base64 -d encoded.model.xlsx > cdm-excel-${{ needs.setup.outputs.release-name }}.xlsx
          rm encoded.model.xlsx
          ../../../main/resources/build-resources/create-deploy-pom.sh cdm-excel ${{ needs.setup.outputs.release-name }} xlsx
          mvn deploy -Prelease -Dcheckstyle.skip=true -Dmaven.deploy.skip=true -s ../../../../settings.xml

  deploy-json-schema:
    name: Deploy JSON Schema
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: needs.setup.outputs.is-release == 'true'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download Maven Artifacts
        uses: actions/download-artifact@v4
        with:
          name: maven-artifacts
          path: ./

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Deploy JSON Schema
        env:
          CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
          CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
          GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd rosetta-source/src/generated
          tar -cvzf cdm-json-schema-${{ needs.setup.outputs.release-name }}.zip jsonschema
          ../../main/resources/build-resources/create-deploy-pom.sh cdm-json-schema ${{ needs.setup.outputs.release-name }} zip
          mvn deploy -Prelease -Dcheckstyle.skip=true -Dmaven.deploy.skip=true -s ../../../settings.xml

  # Tag repository for release builds
  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    needs: [setup, build, build-daml, build-scala, build-csharp8, build-csharp9, build-python]
    if: needs.setup.outputs.is-release == 'true' && success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REGNOSYS_OPS_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "${{ secrets.REGNOSYS_OPS }}"
          git config user.email "ops@regnosys.com"

      - name: Tag Repository
        run: |
          echo "Tagging repository with release name: ${{ needs.setup.outputs.release-name }}"
          git tag ${{ needs.setup.outputs.release-name }} || echo "Tag already exists"
          git push origin ${{ needs.setup.outputs.release-name }} || echo "Tag already pushed"

  # Final status check
  check-status:
    name: Check Build Status
    runs-on: ubuntu-latest
    needs: [build, build-daml, build-scala, build-csharp8, build-csharp9, build-python]
    if: always()
    steps:
      - name: Check for failures
        run: |
          if [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "Main Maven build failed"
            exit 1
          fi
          
          # Check parallel builds - they can continue on error but we report them
          if [[ "${{ needs.build-daml.result }}" == "failure" ]]; then
            echo "Warning: DAML build failed"
          fi
          if [[ "${{ needs.build-scala.result }}" == "failure" ]]; then
            echo "Warning: Scala build failed"
          fi
